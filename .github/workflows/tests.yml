name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env <<'EOF'
          DJANGO_SECRET_KEY=ci-secret
          DJANGO_DEBUG=0
          POSTGRES_DB=bdclimats
          POSTGRES_USER=bdclimats
          POSTGRES_PASSWORD=bdclimats
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      - name: Build containers
        run: docker compose build

      - name: Run tests
        run: python scripts/run_tests.py --coverage

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports
