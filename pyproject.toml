[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
  /migrations/
| /reports/
| /data/
| /htmlcov/
| /__pycache__/
)
'''

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I"]
ignore = ["E501"]
extend-exclude = [
  "migrations",
  "reports",
  "data",
  "htmlcov",
  "__pycache__",
]
